name: Build Suki Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Izinkan gradlew jalan
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sukimod
          path: build/libs/*.jar
